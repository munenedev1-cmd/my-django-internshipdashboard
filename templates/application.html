{% extends 'base.html' %}

{% block title %}Application Form{% endblock %}

{% block content %}
<div class="card">
    <h2>Internship Application Form</h2>
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn">Submit application</button>
    </form>
</div>
{% endblock %}
